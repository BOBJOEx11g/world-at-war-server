name: Server CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Validate generated 258-country catalog
        run: node --input-type=module -e "import('./dist/nation-catalog.js').then(({ ADMIN0_NATION_CATALOG }) => { if (ADMIN0_NATION_CATALOG.length !== 258 || ADMIN0_NATION_CATALOG.some((nation) => !nation.isPlayable)) process.exit(1); console.log('Loaded ' + ADMIN0_NATION_CATALOG.length + ' playable nations; ' + ADMIN0_NATION_CATALOG.filter((nation) => nation.politicalStatus === 'puppet').length + ' puppet states.'); }).catch((error) => { console.error(error); process.exit(1); })"
