name: Server CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Validate administrative map schema
        run: |
          node --input-type=module <<'NODE'
          import { validateAdministrativeMap } from './dist/administrative-model.js';
          if (validateAdministrativeMap([], []).length !== 0) {
            throw new Error('Empty administrative map should validate.');
          }
          const badArea = {
            id: 'area-a',
            name: 'Area A',
            level: 'state-province',
            parentId: 'missing',
            authorityCode: null,
            geometryId: 'geom-a',
            validFrom: null,
            validTo: null,
            provenance: { source: 'test', version: '1', sourceFeatureId: 'a', license: 'test' },
            tags: []
          };
          if (!validateAdministrativeMap([badArea], []).some((error) => error.includes('unknown parent'))) {
            throw new Error('Unknown parent reference was not rejected.');
          }
          console.log('Administrative map schema validation passed.');
          NODE
      - name: Validate generated 258-country catalog
        run: node --input-type=module -e "import('./dist/nation-catalog.js').then(async ({ loadAdmin0NationCatalog }) => { const catalog = await loadAdmin0NationCatalog(); if (catalog.length !== 258 || catalog.some((nation) => !nation.isPlayable)) process.exit(1); console.log('Loaded ' + catalog.length + ' playable nations; ' + catalog.filter((nation) => nation.politicalStatus === 'puppet').length + ' puppet states.'); }).catch((error) => { console.error(error); process.exit(1); })"
